name: Bug report
description: Something does not work with the patched btusb (pairing, audio, timeouts)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please paste raw output rather than paraphrasing: `dmesg`, `lsusb -v`, `dkms status`.

  - type: textarea
    attributes:
      label: Dongle identification
      description: Output of `lsusb -v -d 0a12:0001` (at least idVendor, idProduct, bcdDevice, iManufacturer, iProduct)
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Distribution, kernel (`uname -r`), `dkms status btusb-csr-clone`, `modinfo -F filename btusb`
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: dmesg around the failure
      description: `sudo dmesg | grep -iE 'btusb|Bluetooth|hci0'` — include the lines before and after
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: Symptoms and steps
      description: What fails (pairing, A2DP, HFP, suspend), with the exact commands used. Mention whether the dongle is on a root port or a hub.

  - type: textarea
    attributes:
      label: Module parameters used
      description: `cat /sys/module/btusb/parameters/*` or the values you loaded with
