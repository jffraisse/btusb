# Optional WirePlumber helper for CSR/Barrot USB clones (0a12:0001).
# Keep A2DP only to avoid HFP/SCO glitches on headsets (e.g. OpenRun).
#
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp conf/wireplumber-51-bluez-csr-clone.conf \
#      ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber pipewire pipewire-pulse
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.hfphsp-backend = "none"
  bluez5.enable-msbc = false
  # SBC XQ raises bitrate; on this dongle more bits tend to worsen dropouts.
  bluez5.enable-sbc-xq = false
}

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        # ~60 ms of A2DP buffering absorbs USB/hub jitter from the clone.
        node.latency = 2880/48000
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
