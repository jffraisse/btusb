# Optional PipeWire clock defaults for flaky CSR USB clones.
# Avoid tiny quantums that browsers request; keep a larger default buffer.
#
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp conf/pipewire-51-bt-stable.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse
context.properties = {
  default.clock.min-quantum = 512
  default.clock.quantum     = 1024
  default.clock.max-quantum = 2048
}
